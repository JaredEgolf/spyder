name: Verify Seeds – 4 Suit

on:
  workflow_dispatch:
    inputs:
      count:
        description: Number of NEW verified seeds to add
        default: '20'
        required: false
      start:
        description: 'First seed to try (leave blank to auto-continue from last run)'
        default: ''
        required: false

jobs:
  verify:
    runs-on: ubuntu-latest
    # 4-suit is very hard: each seed can take up to ~50s at full node budget.
    # Default target is 20 seeds; use a 4-hour ceiling to be safe.
    timeout-minutes: 240
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine start seed
        id: start
        run: |
          if [ -n "${{ inputs.start }}" ]; then
            echo "seed=${{ inputs.start }}" >> "$GITHUB_OUTPUT"
          else
            NEXT=$(node -e "
              const src = require('fs').readFileSync('game.js','utf8');
              const m = src.match(/4:\s*\[([\d,\s]*)\]/);
              const arr = m && m[1].trim() ? m[1].split(',').map(Number) : [];
              console.log(arr.length ? Math.max(...arr) + 1 : 0);
            ")
            echo "seed=$NEXT" >> "$GITHUB_OUTPUT"
          fi

      - name: Find verified seeds
        run: |
          echo "Starting from seed ${{ steps.start.outputs.seed }}"
          node tools/verify-seeds.js \
            --suits 4 \
            --count ${{ inputs.count }} \
            --start ${{ steps.start.outputs.seed }} \
            --output seeds-4suit.json

      - name: Show results
        run: cat seeds-4suit.json

      - name: Patch game.js (merge with existing)
        run: node tools/patch-seeds.js --suits 4 --seeds seeds-4suit.json --merge

      - name: Upload seeds artifact
        uses: actions/upload-artifact@v4
        with:
          name: seeds-4suit
          path: seeds-4suit.json

      - name: Commit updated seeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add game.js
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "chore: update verified 4-suit seeds [skip ci]" && git push

name: Update Screenshots

on:
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install puppeteer
        run: npm install puppeteer

      - name: Take 3-suit screenshot
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          const path = require('path');
          const fs = require('fs');
          (async () => {
            const browser = await puppeteer.launch({ args: ['--no-sandbox', '--disable-setuid-sandbox'] });
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 800 });
            await page.goto('file://' + path.resolve('index.html'), { waitUntil: 'networkidle0' });
            await page.click('[data-suits=\"3\"]');
            await new Promise(r => setTimeout(r, 200));
            await page.click('#new-game-btn');
            await new Promise(r => setTimeout(r, 500));
            fs.mkdirSync('screenshots', { recursive: true });
            await page.screenshot({ path: 'screenshots/3-suit.png' });
            await browser.close();
            console.log('Screenshot saved.');
          })();
          "

      - name: Commit screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screenshots/
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "chore: update 3-suit screenshot [skip ci]" && git pull --rebase && git push
